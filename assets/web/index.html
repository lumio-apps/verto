<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verto engine</title>
<script>
  // Report script loading problems (module scripts do not bubble errors).
  window.addEventListener('error', function (e) {
    var t = e.target;
    var msg = (t && t.src) ? ('Could not load ' + t.src) : String(e.message || e);
    try { Verto.postMessage(JSON.stringify({ t: 'fatal', error: msg })); } catch (_) {}
  }, true);
</script>
<script type="module" src="bridge.js"></script>
</head>
<body></body>
</html>
