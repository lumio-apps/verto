name: Release

# Push a tag like v1.0.0 and this builds, signs and publishes the APK.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in pubspec.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB="$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//; s/+.*//' | tr -d '\r ')"
          echo "tag=$TAG pubspec=$PUB"
          if [ "$TAG" != "$PUB" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $PUB"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Fetch translation engine (Bergamot WASM)
        run: dart run tool/fetch_engine.dart

      - name: Word safety net tests (JS)
        run: node tool/test_safety.mjs

      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Sign APK with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Verto-${GITHUB_REF_NAME}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs "Verto-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Verto-${GITHUB_REF_NAME}.apk" \
            --title "Verto $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
