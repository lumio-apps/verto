name: Build language packs

# Run this by hand (Actions tab > Build language packs > Run workflow).
# It downloads Mozilla's translation models and publishes them on a release
# called "packs", which the app reads. It is a pre-release, so it never counts
# as the latest app version.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Language codes separated by spaces. Leave empty for ALL languages Mozilla offers.'
        required: false
        default: ''
      include_beta:
        description: 'Also use beta models (adds more languages, marked Beta in the app).'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zstd support
        run: python -m pip install zstandard

      - name: Build packs
        env:
          LANGS: ${{ inputs.languages }}
          VERTO_NO_BETA: ${{ inputs.include_beta && '0' || '1' }}
        run: python tool/build_packs.py out $LANGS

      - name: Publish on the packs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || gh release create packs \
            --prerelease \
            --title "Language packs" \
            --notes "Offline translation models used by the Verto app (Mozilla Firefox Translations, MPL-2.0). The app downloads from here."
          find out -type f ! -name manifest.json -print0 | xargs -0 -n 10 gh release upload packs --clobber
          gh release upload packs out/manifest.json --clobber
