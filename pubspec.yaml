name: verto
description: "Verto - private offline translator. English to and from nine languages."
publish_to: 'none'

# Keep this line in sync with the git tag you push (tag v1.2.0 -> version: 1.2.0+5).
version: 1.2.0+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  flutter_tts: ^4.2.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/engine/
    - assets/engine/worker/
